[package]
name = "slk"
version = "0.0.2"
edition.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "A personal Slack CLI for developers and coding agents"
repository = "https://github.com/aprilnea/slk"
readme = "README.md"
keywords = ["slack", "cli", "mcp", "automation"]
categories = ["command-line-utilities"]
include = ["/src/**", "/tests/**", "/docs/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE*", "/rust-toolchain.toml"]

[package.metadata.dist]
dist = true

[workspace]
members = [".", "xtask"]
default-members = ["."]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.metadata.release.runners]
x86_64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
x86_64-pc-windows-msvc = "windows-2022"

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
self_update = { version = "1.3.3", default-features = false, features = ["github", "async", "checksums", "compression-tar-xz", "compression-zip-deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "query", "tokio"] }
bytes = "1.12.1"
chromiumoxide = "0.9.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap.workspace = true
dialoguer = { version = "0.12.0", default-features = false }
directories = "6.0.0"
futures-util = "0.3.34"
keyring-core = "1.0.1"
mime = "0.3.18"
multer = "3.1.0"
oauth2 = { version = "5.0.0", default-features = false, features = ["timing-resistant-secret-traits"] }
reqwest.workspace = true
rmcp = { version = "3.9.0", default-features = false, features = ["server", "macros", "transport-io"] }
rpassword = "7.5.4"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = { version = "0.10.3", features = ["serde"] }
self_update.workspace = true
semver = "1.0.28"
serde.workspace = true
serde-aux = "4.7.0"
serde_json.workspace = true
serde_urlencoded = "0.7.1"
slack-morphism = { version = "2.31.1", features = ["hyper"] }
tempfile.workspace = true
text-splitter = { version = "0.33.1", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.0", features = ["v4"] }
vte = "0.15.0"
webbrowser = "1.2.6"
zeroize = "1.9.1"

[dev-dependencies]
base64 = "0.23.1"
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }
rmcp = { version = "3.9.0", default-features = false, features = ["client", "transport-child-process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
wiremock = "0.6.5"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }
windows-permissions = { version = "0.2.4", default-features = false }
